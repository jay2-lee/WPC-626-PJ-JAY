<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ERUSAM - Location</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="./css/about_us.css" />
    <link rel="stylesheet" href="./css/about_location.css" />
    <script src="./js/jquery-3.6.3.min.js"></script>
    <script src="./js/jquery-ui.min.js" defer></script>
    <script src="./js/common_en.js" type="module"></script>
  </head>
  <body>
    <div id="top-area"></div>
    <div id="main-area">
      <section class="page-hero">
        <h2>About Us</h2>
      </section>
      <div class="breadcrumb">
        <a href="index_en.html">Home</a>
        <i class="fas fa-chevron-right"></i>
        <a href="#">About Us</a>
        <i class="fas fa-chevron-right"></i>
        <span>Location</span>
      </div>
      <main class="location-content">
        <h1>Location</h1>
        <div class="location-badge">Seoul</div>
        <div class="map-container">
          <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3162.892289753289!2d126.90089507641984!3d37.55579872408983!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x357c98ce05555555%3A0x0!2zMzfCsDMzJzIwLjkiTiAxMjbCsDU0JzA5LjIiRQ!5e0!3m2!1sko!2skr!4v1700000000000!5m2!1sko!2skr"
            width="100%"
            height="450"
            style="border:0;"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade">
          </iframe>
        </div>
        <div class="info-box">
          <h3>Seoul Office</h3>
          <div class="info-item">
            <span class="info-label">Tel</span>
            <span class="info-value">02-356-1118</span>
          </div>
          <div class="info-item">
            <span class="info-label">Fax</span>
            <span class="info-value">02-354-0597</span>
          </div>
          <div class="info-item">
            <span class="info-label">Address</span>
            <span class="info-value">65, Mangwon-dong 7-gil, Mapo-gu, Seoul (2F, Mangwon-dong)</span>
          </div>
        </div>
      </main>
    </div>
    <div id="bottom-area"></div>
  </body>
