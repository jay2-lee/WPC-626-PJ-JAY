<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ERUSAM - 항균제(은나노 외)</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- 메인 CSS -->
    <link rel="stylesheet" href="./css/about_us.css" />
    <link rel="stylesheet" href="./css/antibacterial.css" />
 
    <!-- 제이쿼리 라이브러리 -->
    <script src="./js/jquery-3.6.3.min.js"></script>
    <script src="./js/jquery-ui.min.js" defer></script>
 
    <!-- 공통 JS -->
    <script src="./js/common.js" type="module"></script>
  </head>
  <body>
    <!-- 1. 상단영역 (common.js에서 자동 로드) -->
    <div id="top-area"></div>
 
    <!-- 2. 메인영역 -->
    <div id="main-area">
      <!-- 히어로 섹션 -->
      <section class="page-hero">
        <h2>신소재</h2>
      </section>
 
      <!-- 브레드크럼 -->
      <div class="breadcrumb">
        <a href="index.html">홈</a>
        <i class="fas fa-chevron-right"></i>
        <a href="#">신소재</a>
        <i class="fas fa-chevron-right"></i>
        <span>항균제(은나노 외)</span>
      </div>
 
      <!-- 메인 컨텐츠 -->
      <main class="product-content">
        <h1>항균제(은나노 외)</h1>
 
        <!-- 제품 섹션 -->
        <section class="product-section">
          <div class="section-header">APPLICATIONS &amp; DURABILITY</div>
          <div class="product-images">
 
            <!-- 제품 정보 테이블 -->
            <div class="product-table">
              <table>
                <thead>
                  <tr>
                    <th>제품명</th>
                    <th>설명</th>
                    <th>세탁내구성</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>KC-TEX050(S)</td>
                    <td>PET, 면, 레이온, 등의 섬유용 항균제(후가공용)</td>
                    <td>세탁내구성 30회 이상</td>
                  </tr>
                  <tr>
                    <td>KC-TEX050(C)</td>
                    <td>각종 섬유 및 다양한 분야 적용 가능한 항균제</td>
                    <td>무바인더</td>
                  </tr>
                  <tr>
                    <td>EVERGREEN M-100CB</td>
                    <td>Selenium 항균제, (후가공용)</td>
                    <td>세탁내구성 30회 이상</td>
                  </tr>
 
                </tbody>
              </table>
            </div>
 
            <!-- 다운로드 버튼 그룹 -->
            <div class="download-group">
              <div class="download-item">
                <span class="download-label">KC-TEX</span>
                <a href="./downloads/KC-TEX.pdf" class="download-btn" download
                  >다운로드</a
                >
              </div>
 
              <div class="download-item">
                <span class="download-label">Evergreen M-100CB</span>
                <a href="./downloads/M-100CB.pdf" class="download-btn" download
                  >다운로드</a
                >
              </div>
 
            </div>
          </div>
        </section>
      </main>
    </div>
 
    <!-- 3. 하단영역 (common.js에서 자동 로드) -->
    <div id="bottom-area"></div>
  </body>
</html>
